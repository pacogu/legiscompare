<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe analitico - LegisCompare</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand"><span class="brand-mark">LC</span><span class="brand-name">LegisCompare</span></div>
    <h1>Informe analitico preliminar</h1>
    <p id="consultaTitulo" style="font-weight:700"></p>
  </div>
</header>
<main>
  <div class="row" style="margin-bottom:14px">
    <a class="btn" href="index.html">Volver a la consulta</a>
    <button class="btn" id="btnImprimir">Imprimir / guardar como PDF</button>
  </div>
  <article class="card">
    <div class="section-title t-blue"><span class="num">B</span><h2>Informe</h2></div>
    <div class="card-body" id="contenido"><div class="empty">Cargando...</div></div>
  </article>

  <article class="card" id="chatCard" style="margin-top:16px;display:none">
    <div class="section-title t-violet"><span class="num">C</span><h2>Consultas sobre este informe</h2></div>
    <div class="card-body">
      <p class="note" style="margin-top:0">Pregunta o pide precisiones sobre las fuentes de este informe. Las respuestas se basan unicamente en las fuentes listadas arriba y siempre indican de cual provienen.</p>
      <div id="chatLog" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>
      <div class="row" style="margin-top:0">
        <input type="text" id="chatInput" placeholder="Ej: ¿cual de estas normas regula sanciones?" style="flex:1;min-width:220px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);font-family:inherit;font-size:14px">
        <button class="btn primary" id="btnChatEnviar">Preguntar</button>
      </div>
    </div>
  </article>
</main>
<script src="js/dossier.js"></script>
</body>
</html>
